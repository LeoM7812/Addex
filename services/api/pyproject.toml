[project]
name = "addex-api"
version = "0.1.0"
description = "Addex HTTP API and Stremio addon"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "addex-core",
    "fastapi>=0.115",
    "redis>=5.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
addex-api = "addex_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/addex_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
