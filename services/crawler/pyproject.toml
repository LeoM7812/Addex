[project]
name = "addex-crawler"
version = "0.1.0"
description = "Probes Stremio addons for stream availability and records the results"
requires-python = ">=3.12"
dependencies = [
    "addex-core",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
addex-crawler = "addex_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/addex_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
