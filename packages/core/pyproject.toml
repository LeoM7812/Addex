[project]
name = "addex-core"
version = "0.1.0"
description = "Shared data model, Stremio manifest parser and ID helpers for Addex"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
addex-manifest = "addex_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/addex_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
