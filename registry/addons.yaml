# Curated addon registry. One entry per manifest URL.
# Configured addons (e.g. Torrentio with specific providers) are separate entries,
# since the config is part of the URL path. Removing an entry disables the addon on the
# next `addex registry sync`.
#
# Before adding an addon, check one /stream/ response by hand, from the server that will
# run the crawler: some only work once configured, some forbid third-party clients, and
# some block datacenter IPs (see "excluded" below).
addons:
  # meta only: parser sanity check, never crawled
  - url: https://v3-cinemeta.strem.io/manifest.json

  # streams: IMDb + Kitsu (anime)
  - url: https://torrentsdb.com/manifest.json
  - url: https://addon.peerflix.mov/manifest.json

# excluded (checked 2026-10-08):
#   *.strem.fun (torrentio, thepiratebay-plus, anime-kitsu)
#                                Cloudflare answers 403 to datacenter IPs, so the
#                                public crawler can't reach them. Excluded until the
#                                author allows it; not worked around.
#   watchhub.strem.io            responses state "for use only by clients authorized in
#                                writing by Stremio"
#   comet.elfhosted.com          403 without configuration
#   mediafusion.elfhosted.com    empty for everything without configuration
#   jackettio.elfhosted.com      returns a "configure this addon" placeholder stream
